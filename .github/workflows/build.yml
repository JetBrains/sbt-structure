name: sbt-structure build & test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_and_test:
    name: sbt-structure plugin Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: sbt
    - name: Cache sbt-structure specific test dependency directories
      uses: actions/cache@v5
      with:
        path: |
          ~/.sbt-structure-global/coursier
          ~/.sbt-structure-global/ivy2
        key: ${{ runner.os }}-sbt-structure-global-coursier-ivy-home
    - uses: sbt/setup-sbt@v1
    - name: Compile & Test
      if: matrix.java == 17
      run: sbt clean crossCompileAndRunTests
    - name: Compile modern plugin lanes
      if: matrix.java != 17
      run: sbt 'project extractor' '++2.12.21' compile '++3.9.0' compile
